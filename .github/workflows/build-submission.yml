name: Build HackerRank submission
on:
  push:
    branches: [main]
    paths-ignore:
      - output.csv
      - code.zip
      - log.txt
      - code/evaluation/*.md
      - dataset/evidence/parsed_media/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract PDF and screenshot evidence
        run: |
          if ! command -v pdftotext >/dev/null || ! command -v tesseract >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils tesseract-ocr
          fi
          python3 code/extract_media.py
      - name: Run evidence audit for all cases
        run: python3 code/main.py
      - name: Validate predictions and generate reports
        run: python3 code/evaluation/main.py
      - name: Build portable submission ZIP
        run: python3 code/package.py
      - name: Store deliverables in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output.csv code.zip code/evaluation/evaluation_report.md code/evaluation/usage_report.md code/evaluation/media_audit.md dataset/evidence/parsed_media/
          if ! git diff --cached --quiet; then
            git commit -m "Generate audited predictions and submission artifacts"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hackerrank-orchestrate-submission
          path: |
            output.csv
            code.zip
            log.txt
            code/evaluation/*.md
          if-no-files-found: warn
          retention-days: 15
