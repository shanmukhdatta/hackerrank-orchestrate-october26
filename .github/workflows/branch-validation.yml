name: Validate agent hardening branch
on:
  push:
    branches:
      - agent/data-grounded-hardening-20261025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract supplied PDF/image evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr
          python3 code/extract_media.py
      - name: Confirm observed dataset edge cases
        run: python3 code/evaluation/dataset_edge_tests.py
      - name: Run agent regression tests
        run: node code/evaluation/tests.js
      - name: Validate negative evidence and anonymous provenance
        run: node code/evaluation/negative_evidence_tests.js
      - name: Generate 518-case audit
        run: python3 code/main.py
      - name: Evaluate public sample answers and validate output
        run: python3 code/evaluation/main.py
      - name: Check output evidence and submission package
        run: |
          python3 code/evaluation/submission_check.py
          python3 code/package.py
          python3 - <<'PY'
          import os,zipfile,hashlib
          for name in ('output.csv','code.zip','submission_bundle.zip'):
              with open(name,'rb') as f:
                  data=f.read()
              print(name, len(data),'bytes SHA256',hashlib.sha256(data).hexdigest())
          with zipfile.ZipFile('code.zip') as z:
              print('code.zip files:',len(z.namelist()))
          PY
      - name: Print reproducible quality report
        if: always()
        run: |
          if [ -f code/evaluation/evaluation_report.md ]; then
            sed -n '1,60p' code/evaluation/evaluation_report.md
          fi
      - name: Upload submission deliverables for user review
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ghost-data-final-submission-candidate
          path: |
            output.csv
            code.zip
            submission_bundle.zip
            code/evaluation/*.md
          if-no-files-found: error
          retention-days: 15
      - name: Preserve failed-run diagnostic reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ghost-data-diagnostics
          path: code/evaluation/*.md
          if-no-files-found: warn
